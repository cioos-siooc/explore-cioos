version: 2
updates:
  # Grouped so a week's patches arrive as one PR per ecosystem rather than a
  # dozen. Majors are separate: they need a human either way.
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web-api
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      web-api-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /test
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      test-minor-patch:
        update-types: [minor, patch]

  # One entry per uv project — each has its own pyproject.toml and uv.lock.
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /harvester
    schedule: { interval: weekly, day: monday }
    groups:
      harvester-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /downloader
    schedule: { interval: weekly, day: monday }
    groups:
      downloader-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /download_scheduler
    schedule: { interval: weekly, day: monday }
    groups:
      scheduler-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/frontend, /web-api, /nginx, /database, /harvester, /download_scheduler]
    schedule: { interval: monthly }
    groups:
      base-images:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions:
        patterns: ["*"]
