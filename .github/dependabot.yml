version: 2
updates:
  # Grouped so a week's updates arrive as at most three PRs per block rather
  # than a dozen: minor/patch, majors (they need a human either way), and
  # security, since security updates ignore version-update groups.
  # Root holds the shared lint/format toolchain (ESLint, Prettier, stylelint).
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      tooling-minor-patch:
        update-types: [minor, patch]
      tooling-major:
        update-types: [major]
      tooling-security:
        applies-to: security-updates
        patterns: ["*"]

  # One block for both apps so a dependency shared by them (and the week's
  # bumps in general) lands as a single PR instead of one per directory.
  - package-ecosystem: npm
    directories: [/frontend, /web-api]
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      apps-minor-patch:
        update-types: [minor, patch]
      apps-major:
        update-types: [major]
      apps-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /test
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      test-minor-patch:
        update-types: [minor, patch]
      test-major:
        update-types: [major]
      test-security:
        applies-to: security-updates
        patterns: ["*"]

  # All uv projects (each with its own pyproject.toml and uv.lock) share one
  # block so e.g. a pytest bump arrives as one PR rather than four.
  - package-ecosystem: uv
    directories: [/, /harvester, /downloader, /download_scheduler]
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]
      python-major:
        update-types: [major]
      python-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/frontend, /web-api, /nginx, /database, /harvester, /download_scheduler]
    schedule: { interval: monthly }
    groups:
      base-images:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: monthly }
    groups:
      compose-images:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions:
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
