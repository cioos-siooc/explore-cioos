version: 2
updates:
  # Grouped so a week's updates arrive as at most three PRs per service rather
  # than a dozen: minor/patch, majors (they need a human either way), and
  # security, since security updates ignore version-update groups.
  # Root holds the shared lint/format toolchain (ESLint, Prettier, stylelint).
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      tooling-minor-patch:
        update-types: [minor, patch]
      tooling-major:
        update-types: [major]
      tooling-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
      frontend-major:
        update-types: [major]
      frontend-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web-api
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      web-api-minor-patch:
        update-types: [minor, patch]
      web-api-major:
        update-types: [major]
      web-api-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /test
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      test-minor-patch:
        update-types: [minor, patch]
      test-major:
        update-types: [major]
      test-security:
        applies-to: security-updates
        patterns: ["*"]

  # One entry per uv project — each has its own pyproject.toml and uv.lock.
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]
      python-major:
        update-types: [major]
      python-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /harvester
    schedule: { interval: weekly, day: monday }
    groups:
      harvester-minor-patch:
        update-types: [minor, patch]
      harvester-major:
        update-types: [major]
      harvester-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /downloader
    schedule: { interval: weekly, day: monday }
    groups:
      downloader-minor-patch:
        update-types: [minor, patch]
      downloader-major:
        update-types: [major]
      downloader-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /download_scheduler
    schedule: { interval: weekly, day: monday }
    groups:
      scheduler-minor-patch:
        update-types: [minor, patch]
      scheduler-major:
        update-types: [major]
      scheduler-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/frontend, /web-api, /nginx, /database, /harvester, /download_scheduler]
    schedule: { interval: monthly }
    groups:
      base-images:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: monthly }
    groups:
      compose-images:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions:
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
