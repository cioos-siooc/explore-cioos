version: 2
updates:
  # Grouped so updates arrive as at most three PRs per block rather than a
  # dozen: minor/patch, majors (they need a human either way), and security,
  # since security updates ignore version-update groups. Cooldown only delays
  # version updates; security updates still open immediately.
  # One block for every npm project (root lint/format toolchain, frontend,
  # web-api, e2e tests) so a shared dependency lands as a single PR.
  - package-ecosystem: npm
    directories: [/, /frontend, /web-api, /test]
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
      npm-major:
        update-types: [major]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  # All uv projects (each with its own pyproject.toml and uv.lock) share one
  # block. lockfile-only keeps pyproject ranges as written, so majors outside
  # them are bumped by hand.
  - package-ecosystem: uv
    directories: [/, /harvester, /downloader, /download_scheduler]
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    versioning-strategy: lockfile-only
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      python-minor-patch:
        update-types: [minor, patch]
      python-major:
        update-types: [major]
      python-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/frontend, /web-api, /nginx, /database, /harvester, /download_scheduler]
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    groups:
      base-images:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    groups:
      compose-images:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
    groups:
      actions:
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
