name: Integration Tests

on:
  pull_request:
    branches:
      - main
      - master # Keep coverage while master remains the repository default branch.
      - "development*"
  workflow_dispatch:

concurrency:
  group: integration-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Compose harvest, API, and download
    timeout-minutes: 45
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILES: -f docker-compose.yaml -f docker-compose.override.yaml
      COMPOSE_PROJECT_NAME: explore-cioos-ci
      API_URL: http://localhost:8098/api
    steps:
      - uses: actions/checkout@v6

      - name: Prepare CI configuration
        run: |
          cp .env.sample .env
          cp docker-compose.override.yaml.sample docker-compose.override.yaml
          cp harvest_config.sample.yaml harvest_config.yaml

      - name: Start the full application
        run: docker compose $COMPOSE_FILES --profile tools up -d --build --wait --wait-timeout 300

      - name: Wait for the API
        # Do not request a data endpoint here: Redis would cache its empty
        # pre-harvest response and hide the data loaded by the next step.
        run: curl --fail --retry 60 --retry-all-errors --retry-delay 2 "$API_URL/openapi.json"

      - name: Run the sample harvest
        run: |
          # The worker registers this deployment during startup. --watch returns a
          # non-zero status if the harvest flow fails.
          timeout 25m docker compose $COMPOSE_FILES exec -T prefect_worker \
            uv run prefect deployment run "Harvest Source/cde-harvester-deployment" --watch

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: test/package-lock.json

      - name: Install integration-test dependencies
        working-directory: test
        run: npm ci --quiet

      - name: Test harvested API
        working-directory: test
        run: node test_api_endpoints.js

      - name: Submit and complete a download request
        run: |
          set -euo pipefail
          read -r latitude longitude time_min < <(
            docker compose $COMPOSE_FILES exec -T db \
              psql -U postgres -d cde -At -F ' ' \
              -c "SELECT latitude, longitude, to_char(time_min AT TIME ZONE 'UTC', 'YYYY-MM-DD\"T\"HH24:MI:SS\"Z\"') FROM cde.profiles WHERE latitude IS NOT NULL AND longitude IS NOT NULL AND time_min IS NOT NULL LIMIT 1"
          )
          test -n "${latitude:-}" && test -n "${longitude:-}" && test -n "${time_min:-}"
          CI_LATITUDE="$latitude" CI_LONGITUDE="$longitude" CI_TIME="$time_min" \
            node test/test_download_request.js

          job_id="$(docker compose $COMPOSE_FILES exec -T db \
            psql -U postgres -d cde -At \
            -c "SELECT job_id FROM cde.download_jobs ORDER BY pk DESC LIMIT 1")"
          test -n "$job_id"

          for _ in $(seq 1 60); do
            status="$(docker compose $COMPOSE_FILES exec -T db \
              psql -U postgres -d cde -At \
              -c "SELECT status FROM cde.download_jobs WHERE job_id = '$job_id'")"
            case "$status" in
              completed)
                curl --fail --retry 5 --retry-all-errors \
                  "http://localhost:8098/downloads/cde_download_${job_id}.zip" \
                  --output download.zip
                unzip -t download.zip
                exit 0
                ;;
              failed|no-data|over-limit)
                echo "Download job $job_id finished with status: $status" >&2
                exit 1
                ;;
            esac
            sleep 5
          done

          echo "Timed out waiting for download job $job_id (last status: $status)" >&2
          exit 1

      - name: Test frontend loads without errors
        working-directory: test
        env:
          CI: "true"
        run: node frontend_loads_without_errors.js

      - name: Print Compose diagnostics
        if: failure()
        run: docker compose $COMPOSE_FILES logs --no-color

      - name: Stop containers
        if: always()
        run: docker compose $COMPOSE_FILES down -v
