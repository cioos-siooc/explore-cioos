name: Integration Tests

on:
  pull_request:
    branches:
      - main
      - master # Keep coverage while master remains the repository default branch.
      - "development*"
  workflow_dispatch:

jobs:
  docker:
    name: Compose harvest, API, and download
    timeout-minutes: 45
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILES: -f docker-compose.yaml -f docker-compose.override.yaml
      COMPOSE_PROJECT_NAME: explore-cioos-ci
      API_URL: http://localhost:8098/api
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"

      - name: Run all Python tests
        run: |
          uv sync --locked
          uv run pytest

      - name: Prepare CI configuration
        run: |
          cp .env.sample .env
          cp docker-compose.override.yaml.sample docker-compose.override.yaml
          cp harvest_config.sample.yaml harvest_config.yaml

      - name: Start the full application
        run: docker compose $COMPOSE_FILES --profile tools up -d --build --wait --wait-timeout 300

      - name: Wait for the API
        # Do not request a data endpoint here: Redis would cache its empty
        # pre-harvest response and hide the data loaded by the next step.
        run: curl --fail --retry 60 --retry-all-errors --retry-delay 2 "$API_URL/openapi.json"

      - name: Run the sample harvest
        run: |
          # Compose can report the worker as started before its entrypoint has
          # registered the deployments with Prefect. Wait for that registration.
          deployment="Harvest Source/cde-harvester-deployment"
          registered=false
          for _ in $(seq 1 60); do
            if docker compose $COMPOSE_FILES exec -T prefect_worker \
              uv run prefect deployment inspect "$deployment" >/dev/null 2>&1; then
              registered=true
              break
            fi
            sleep 5
          done
          test "$registered" = true

          # --watch returns a non-zero status if the harvest flow fails.
          timeout 25m docker compose $COMPOSE_FILES exec -T prefect_worker \
            uv run prefect deployment run "$deployment" --watch

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: test/package-lock.json

      - name: Install integration-test dependencies
        working-directory: test
        run: npm ci --quiet

      - name: Run JavaScript API and frontend tests
        env:
          CI: "true"
        run: |
          read -r latitude longitude < <(
            docker compose $COMPOSE_FILES exec -T db \
              psql -U postgres -d cde -At -F ' ' \
              -c "SELECT latitude, longitude FROM cde.profiles WHERE latitude IS NOT NULL AND longitude IS NOT NULL LIMIT 1"
          )
          test -n "${latitude:-}" && test -n "${longitude:-}"
          CI_LATITUDE="$latitude" CI_LONGITUDE="$longitude" npm --prefix test test

      - name: Submit and complete a download request
        run: .github/scripts/test-download-request.sh


      - name: Print Compose diagnostics
        if: failure()
        run: docker compose $COMPOSE_FILES logs --no-color

      - name: Stop containers
        if: always()
        run: docker compose $COMPOSE_FILES down -v
