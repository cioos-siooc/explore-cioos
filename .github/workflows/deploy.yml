name: Deploy

# The tag name picks the target (anything else is rejected):
#   beta*          -> beta        any development*/master commit
#   vX.Y.Z-rc.N    -> staging     master only
#   vX.Y.Z         -> production  master only, and only a SHA whose staging
#                                 deployment succeeded
# beta and staging share one stack on the Juno host cioos-co-dev-explore
# (explore.dev.cioos.ca, behind Caddy basic_auth), one deploy at a time. Each new
# tag gets a fresh database volume (docker-compose.staging.yaml). Wait for the release's Integration Tests (including
# visual regression) before deploying.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to redeploy
        required: true
        type: string

permissions:
  actions: read
  contents: read
  deployments: read

jobs:
  release:
    name: Verify release
    timeout-minutes: 90
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      target: ${{ steps.release.outputs.target }}
    steps:
      - name: Checkout release
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0

      - name: Verify release and source branch
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PUBLISHED_AT: ${{ github.event.release.published_at }}
        run: |
          case "$TAG" in
            beta*) target=beta ;;
            *) if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then target=staging
               elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then target=production
               else echo "Tag $TAG is not beta*, vX.Y.Z-rc.N or vX.Y.Z" >&2; exit 1; fi ;;
          esac
          git show-ref --verify --quiet "refs/tags/$TAG"
          sha=$(git rev-parse "$TAG^{commit}")
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
          test "$(jq -r '.draft' <<< "$release")" = false
          if [ "$target" = production ]; then
            test "$(jq -r '.prerelease' <<< "$release")" = false
          else
            test "$(jq -r '.prerelease' <<< "$release")" = true
          fi
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          if [ "$target" = beta ]; then
            found=false
            for branch in $(git for-each-ref --format='%(refname)' refs/remotes/origin); do
              case "$branch" in
                refs/remotes/origin/development*|refs/remotes/origin/master)
                  if git merge-base --is-ancestor "$sha" "$branch"; then found=true; break; fi ;;
              esac
            done
            test "$found" = true
          else
            git merge-base --is-ancestor "$sha" refs/remotes/origin/master
          fi
          if [ "$target" = production ]; then
            staged=false
            for id in $(gh api "repos/$GITHUB_REPOSITORY/deployments?sha=$sha&environment=staging&per_page=100" --jq '.[].id'); do
              state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" --jq '.[0].state')
              if [ "$state" = success ]; then staged=true; break; fi
            done
            test "$staged" = true || { echo "$sha has no successful staging deployment" >&2; exit 1; }
          fi
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            for _ in $(seq 1 70); do
              conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build_and_test.yml/runs?event=release&head_sha=$sha&per_page=100" \
                | jq -r --arg published "$PUBLISHED_AT" '.workflow_runs | map(select(.created_at >= $published)) | sort_by(.created_at) | last | .conclusion // "pending"')
              case "$conclusion" in
                success) break ;;
                pending) sleep 60 ;;
                *) echo "Release Integration Tests: $conclusion" >&2; exit 1 ;;
              esac
            done
            test "$conclusion" = success
          fi
          {
            printf 'sha=%s\n' "$sha"
            printf 'tag=%s\n' "$TAG"
            printf 'target=%s\n' "$target"
          } >> "$GITHUB_OUTPUT"

  staging:
    name: Deploy ${{ needs.release.outputs.target }}
    needs: release
    if: needs.release.outputs.target != 'production'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    # beta and staging deploy the same stack, but stay separate GitHub
    # environments so only a staging deployment satisfies the production gate.
    environment: ${{ needs.release.outputs.target }}
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: cioos-siooc/cioos-deploy-docker-compose@main
        with:
          wg_config: ${{ secrets.JUNO_WIREGUARD_VPN_CONFIG }}
          # cioos-co-dev-explore (not a secret: an internal address, reachable
          # only over the VPN above).
          ssh_host: 172.16.61.26
          ssh_username: runner
          ssh_key: ${{ secrets.JUNO_RUNNER_PRIVATE_KEY }}
          deploy_path: /srv/services/explore-cioos-staging
          stack_name: explore-cioos-staging
          compose_files: docker-compose.yaml docker-compose.production.yaml docker-compose.staging.yaml
          op_secret_files: .env.staging:.env
          # The tag doubles as the Sentry release, shared by web-api and the
          # frontend's sourcemap upload.
          env_overrides: |
            DEPLOY_TAG=${{ needs.release.outputs.tag }}
            SENTRY_RELEASE=${{ needs.release.outputs.tag }}
          op_service_account_token: ${{ secrets.CIOOS_CO_1PASSWORD_TOKEN }}
          git_sha: ${{ needs.release.outputs.sha }}
          docker_compose_down: "true"

  production:
    name: Deploy production
    needs: release
    if: needs.release.outputs.target == 'production'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: cioos-siooc/cioos-deploy-docker-compose@main
        with:
          wg_config: ${{ secrets.JUNO_WIREGUARD_VPN_CONFIG }}
          ssh_host: ${{ secrets.SERVER_IP }}
          ssh_username: runner
          ssh_key: ${{ secrets.JUNO_RUNNER_PRIVATE_KEY }}
          deploy_path: /srv/services/explore-cioos
          stack_name: explore-cioos-production
          compose_files: docker-compose.yaml docker-compose.production.yaml
          op_secret_files: .env.production:.env
          env_overrides: SENTRY_RELEASE=${{ needs.release.outputs.tag }}
          op_service_account_token: ${{ secrets.CIOOS_CO_1PASSWORD_TOKEN }}
          git_sha: ${{ needs.release.outputs.sha }}
          docker_compose_down: "true"
