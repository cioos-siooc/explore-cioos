name: Deploy

# Gated on tests. This workflow used to trigger on `push` while reading
# `github.event.workflow_run.*` in three places — an expression that is always
# null outside a workflow_run event — so it fell through to `github.ref_name`
# and a red build deployed anyway. It now runs only when the Integration Tests
# workflow finishes on a deployable branch, and only when that run succeeded.
#
# Integration Tests is the single gate because it is a superset: it runs the
# whole Python suite (`uv run pytest`) before standing up compose, on top of the
# JS API/frontend suite and the download-request check.
on:
  workflow_run:
    workflows: ["Integration Tests"]
    types: [completed]
    branches:
      - master
      - development
  workflow_dispatch:

jobs:
  deploy:
    # workflow_dispatch has no workflow_run context — deploying by hand stays a
    # deliberate override.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: Deploy to ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'master' && 'production' || 'development' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    environment: ${{ (github.event.workflow_run.head_branch || github.ref_name) == 'master' && 'production' || 'development' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # A workflow_run event checks out the DEFAULT branch unless told
          # otherwise, which would deploy master's compose files to development.
          # Deploy exactly the commit that was tested.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: cioos-siooc/cioos-deploy-docker-compose@main
        with:
          wg_config: ${{ secrets.BELUGA_WIREGUARD_VPN_CONFIG }}
          ssh_host: "${{ secrets.SERVER_IP }}"
          ssh_username: "runner"
          ssh_key: ${{ secrets.BELUGA_RUNNER_PRIVATE_KEY }}
          deploy_path: "/srv/services/explore-cioos"
          stack_name: "explore-cioos-${{ (github.event.workflow_run.head_branch || github.ref_name) == 'master' && 'production' || 'development' }}"
          # Production is an OVERLAY on the base file, not a standalone stack.
          compose_files: "docker-compose.yaml docker-compose.production.yaml"
          op_secret_files: ".env.production:.env"
          op_service_account_token: ${{ secrets.CIOOS_CO_1PASSWORD_TOKEN }}
          docker_compose_down: "true"
