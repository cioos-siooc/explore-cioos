name: Deploy

# What triggers it picks the target (any other tag is rejected):
#   push to main          -> staging
#   vX.Y.Z full release   -> production  main only, and only a SHA whose
#                                        staging deployment succeeded
# Staging runs on the Juno host cioos-co-dev-explore (served at
# beta.explore.cioos.ca for now) and always keeps its volumes: reset the
# database by hand (README → Deployment). Each deploy waits for the
# Integration Tests of its push or release (a release's include visual
# regression).
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to redeploy
        required: true
        type: string

permissions:
  actions: read
  contents: read
  deployments: read

jobs:
  release:
    name: Verify release
    if: ${{ !github.event.release.prerelease }}
    timeout-minutes: 90
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      target: ${{ steps.release.outputs.target }}
    steps:
      - name: Checkout release
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.sha }}
          fetch-depth: 0

      - name: Verify release and source branch
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PUBLISHED_AT: ${{ github.event.release.published_at }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            # Named by commit: SENTRY_RELEASE and the User-Agent carry it.
            target=staging sha=$GITHUB_SHA TAG=main-${GITHUB_SHA::7} tests_event=push
          else
            [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag $TAG is not vX.Y.Z" >&2; exit 1; }
            target=production
            git show-ref --verify --quiet "refs/tags/$TAG"
            sha=$(git rev-parse "$TAG^{commit}")
            tests_event=release
            release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
            test "$(jq -r '.draft' <<< "$release")" = false
            test "$(jq -r '.prerelease' <<< "$release")" = false
          fi
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          git merge-base --is-ancestor "$sha" refs/remotes/origin/main
          if [ "$target" = production ]; then
            staged=false
            for id in $(gh api "repos/$GITHUB_REPOSITORY/deployments?sha=$sha&environment=staging&per_page=100" --jq '.[].id'); do
              state=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" --jq '.[0].state')
              if [ "$state" = success ]; then staged=true; break; fi
            done
            test "$staged" = true || { echo "$sha has no successful staging deployment" >&2; exit 1; }
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # A redeploy doesn't re-run the tests, but the SHA must have passed them.
            passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build_and_test.yml/runs?event=release&head_sha=$sha&status=success&per_page=1" --jq '.total_count')
            test "$passed" -gt 0 || { echo "$sha has no successful release Integration Tests run" >&2; exit 1; }
          else
            for _ in $(seq 1 70); do
              conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build_and_test.yml/runs?event=$tests_event&head_sha=$sha&per_page=100" \
                | jq -r --arg published "$PUBLISHED_AT" '.workflow_runs | map(select(.created_at >= $published)) | sort_by(.created_at) | last | .conclusion // "pending"')
              case "$conclusion" in
                success) break ;;
                pending) sleep 60 ;;
                *) echo "Integration Tests ($tests_event): $conclusion" >&2; exit 1 ;;
              esac
            done
            test "$conclusion" = success
          fi
          {
            printf 'sha=%s\n' "$sha"
            printf 'tag=%s\n' "$TAG"
            printf 'target=%s\n' "$target"
          } >> "$GITHUB_OUTPUT"

  staging:
    name: Deploy staging
    needs: release
    if: needs.release.outputs.target == 'staging'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: cioos-siooc/cioos-deploy-docker-compose@main
        with:
          wg_config: ${{ secrets.JUNO_WIREGUARD_VPN_CONFIG }}
          # cioos-co-dev-explore (not a secret: an internal address, reachable
          # only over the VPN above).
          ssh_host: 172.16.61.26
          ssh_username: runner
          ssh_key: ${{ secrets.JUNO_RUNNER_PRIVATE_KEY }}
          deploy_path: /srv/services/explore-cioos-staging
          stack_name: explore-cioos-staging
          compose_files: docker-compose.yaml docker-compose.production.yaml
          op_secret_files: .env.staging:.env
          # The tag doubles as the Sentry release, shared by web-api and the
          # frontend's sourcemap upload.
          env_overrides: |
            SENTRY_RELEASE=${{ needs.release.outputs.tag }}
            SOURCE_COMMIT=${{ needs.release.outputs.sha }}
          op_service_account_token: ${{ secrets.CIOOS_CO_1PASSWORD_TOKEN }}
          git_sha: ${{ needs.release.outputs.sha }}
          wait: "true"

  production:
    name: Deploy production
    needs: release
    if: needs.release.outputs.target == 'production'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: cioos-siooc/cioos-deploy-docker-compose@main
        with:
          wg_config: ${{ secrets.JUNO_WIREGUARD_VPN_CONFIG }}
          ssh_host: ${{ secrets.SERVER_IP }}
          ssh_username: runner
          ssh_key: ${{ secrets.JUNO_RUNNER_PRIVATE_KEY }}
          # Not explore-cioos / explore-cioos-production: those are the old
          # build's checkout and compose project, which keep serving until the
          # proxy is switched to this stack.
          deploy_path: /srv/services/explore-cioos-v2
          stack_name: explore-cioos-v2
          compose_files: docker-compose.yaml docker-compose.production.yaml
          op_secret_files: .env.production:.env
          env_overrides: |
            SENTRY_RELEASE=${{ needs.release.outputs.tag }}
            SOURCE_COMMIT=${{ needs.release.outputs.sha }}
          op_service_account_token: ${{ secrets.CIOOS_CO_1PASSWORD_TOKEN }}
          git_sha: ${{ needs.release.outputs.sha }}
          wait: "true"
