name: Frontend Preview

# Coolify ignores watch paths for PR events (coollabsio/coolify#6503), so its
# own preview webhook would build every PR. The preview app has no webhook
# source; this workflow is the only thing that deploys or removes previews.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - development-v2
    paths:
      - "frontend/**"

concurrency:
  group: frontend-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
  COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
  APP_UUID: ${{ secrets.COOLIFY_FRONTEND_PREVIEW_UUID }}
  PR: ${{ github.event.pull_request.number }}

jobs:
  deploy:
    name: Deploy preview
    # Fork PRs get no secrets, and would run untrusted code on our server.
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: frontend-preview
      url: https://pr-${{ github.event.pull_request.number }}.preview.cool.juno.cioos.ca
    steps:
      - name: Trigger Coolify preview deployment
        id: trigger
        run: |
          response=$(curl -fsS -X POST -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_URL/api/v1/deploy?uuid=$APP_UUID&pr=$PR")
          echo "$response"
          echo "deployment=$(jq -r '.deployments[0].deployment_uuid' <<<"$response")" >> "$GITHUB_OUTPUT"

      - name: Wait for the build
        env:
          DEPLOYMENT: ${{ steps.trigger.outputs.deployment }}
        run: |
          for _ in $(seq 90); do
            status=$(curl -fsS -H "Authorization: Bearer $COOLIFY_TOKEN" \
              "$COOLIFY_URL/api/v1/deployments/$DEPLOYMENT" | jq -r '.status')
            echo "status: $status"
            case "$status" in
              finished) exit 0 ;;
              failed | cancelled*) exit 1 ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for deployment $DEPLOYMENT"
          exit 1

  cleanup:
    name: Remove preview
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete Coolify preview
        run: |
          curl -fsS -X DELETE -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_URL/api/v1/applications/$APP_UUID/previews/$PR"
