name: Frontend Tests

on:
  pull_request:
    branches:
      - main
      - master # Keep coverage while master remains the repository default branch.
      - "development*"
    paths:
      - "frontend/**"
      - ".github/workflows/test-frontend.yaml"
  workflow_dispatch:

concurrency:
  group: frontend-tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  unit:
    name: Unit and component tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # frontend/package.json declares engines.node >= 22, and the frontend
          # image builds on node:22-alpine.
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run the unit suite
        run: npm run test:coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  e2e:
    name: E2E, visual and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      # Must match @playwright/test in frontend/package.json exactly — a
      # mismatch fails with "Executable doesn't exist at /ms-playwright/…".
      # Bump the two together.
      #
      # Running in the container is what makes the screenshot baselines
      # reproducible: it is the same image `npm run test:visual:update` uses
      # locally, so fonts and Chromium match rather than differing per machine.
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      # Chromium dies on the default 64MB /dev/shm.
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run the browser suites
        run: npx playwright test
        env:
          CI: "true"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
