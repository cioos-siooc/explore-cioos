name: Frontend Tests

on:
  # Long-lived branches are verified on what actually landed, not only on what
  # a pull request predicted would land.
  push:
    branches:
      - main
      - master
      - "development*"
    paths:
      - "frontend/**"
      - ".github/workflows/test-frontend.yaml"
  pull_request:
    branches:
      - main
      - master # Keep coverage while master remains the repository default branch.
      - "development*"
    paths:
      - "frontend/**"
      - ".github/workflows/test-frontend.yaml"
  workflow_dispatch:

concurrency:
  group: frontend-tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  unit:
    name: Unit and component tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # frontend/package.json declares engines.node >= 22, and the frontend
          # image builds on node:22-alpine.
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run the unit suite
        run: npm run test:coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  e2e:
    name: E2E, visual and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Whether the UI-coupled suites gate or merely report. Every step below
      # reads this, so the policy lives in one place.
      #
      # Strict on the release path — anything pushed to main, master or a
      # development branch, any pull request promoting one of those into
      # main/master, and any manual run — because that is where the interface
      # has to be held to its baselines.
      #
      # Relaxed elsewhere, which in this repo means the feature branches that
      # stack onto an integration branch. Those are where the UI is actively
      # being reworked, and gating them on pixel baselines is the slowdown this
      # is meant to avoid. Behaviour still gates everywhere.
      STRICT: ${{ github.event_name != 'pull_request' || github.base_ref == 'main' || github.base_ref == 'master' }}
    container:
      # Must match @playwright/test in frontend/package.json exactly — a
      # mismatch fails with "Executable doesn't exist at /ms-playwright/…".
      # Bump the two together.
      #
      # Running in the container is what makes the screenshot baselines
      # reproducible: it is the same image `npm run test:visual:update` uses
      # locally, so fonts and Chromium match rather than differing per machine.
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      # Chromium dies on the default 64MB /dev/shm.
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # What gates a pull request: behaviour, asserted through data-testid and
      # user-visible text. Those survive restyling by design, so they stay
      # required while the UI is being reworked.
      - name: Run the behavioural suites
        run: npm run test:e2e
        env:
          CI: "true"

      # Runs everywhere; gates only on the release path. The baseline is a
      # ratchet — markup that trips a rule it has not seen before is a hard
      # failure — which is the right bar for promoting an interface and the
      # wrong one for a branch still rebuilding it. Off the release path it
      # still reports, it just does not block.
      - name: Run the accessibility suite
        continue-on-error: ${{ env.STRICT != 'true' }}
        run: npx playwright test --project=a11y
        env:
          CI: "true"

      # Gates on the release path, skipped off it — skipped rather than
      # advisory, because a UI under active change makes these stale on purpose
      # and a failure nobody should act on is just noise and runtime. To compare
      # a work-in-progress branch anyway, run the workflow manually, or locally
      # with `npm run test:visual` (`npm run test:visual:update` to re-record).
      # Baselines are recorded in this same image so the renderer and the
      # fallback font stack match — see e2e/in-container.sh.
      - name: Run the visual suite
        if: ${{ env.STRICT == 'true' }}
        run: npx playwright test --project=visual
        env:
          CI: "true"

      # always(), not failure(): off the release path a failing advisory step
      # still leaves the job green, and the report is the only way to see it.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
