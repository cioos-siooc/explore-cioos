name: Frontend Tests

on:
  # Long-lived branches are verified on what actually landed, not only on what
  # a pull request predicted would land.
  push:
    branches:
      - main
      - master
      - "development*"
    paths:
      - "frontend/**"
      - ".github/workflows/test-frontend.yaml"
  pull_request:
    branches:
      - main
      - master # Keep coverage while master remains the repository default branch.
      - "development*"
    paths:
      - "frontend/**"
      - ".github/workflows/test-frontend.yaml"
  workflow_dispatch:

concurrency:
  group: frontend-tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  unit:
    name: Unit and component tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # frontend/package.json declares engines.node >= 26, and the frontend
          # image builds on node:26-alpine.
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run the unit suite
        run: npm run test:coverage

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  e2e:
    name: E2E and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      # Must match @playwright/test in frontend/package.json exactly; bump the
      # two together. The same image as e2e/in-container.sh keeps a11y node
      # counts reproducible.
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      # Chromium dies on the default 64MB /dev/shm.
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # These assert through data-testid and user-visible text, which survive
      # restyling, so they gate every push and PR. The visual suite is gated
      # only on a published release (build_and_test.yml).
      - name: Run the behavioural and accessibility suites
        run: npx playwright test --project=desktop --project=tablet --project=mobile --project=a11y
        env:
          CI: "true"

      # Informational only: a diff means the PR changes the interface, not that
      # it's wrong. The release run in build_and_test.yml is the gate. The list
      # reporter keeps the github reporter's error annotations off the PR.
      - name: Check the visual baselines
        id: visual
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: npx playwright test --project=visual --retries=0 --reporter=list --output=test-results-visual
        env:
          CI: "true"

      - name: Flag the interface change
        if: steps.visual.outcome == 'failure'
        run: |
          msg="This PR changes the interface: visual baselines differ. If intended, run 'npm run test:visual:update' in frontend/ and commit the screenshots before the next release."
          echo "::warning title=Interface changed::$msg"
          {
            echo "### Interface changed"
            echo "$msg"
            echo "Expected/actual/diff images are in the \`visual-diffs\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: steps.visual.outcome == 'failure'
        with:
          name: visual-diffs
          path: frontend/test-results-visual/
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
