name: Frontend Tests

on:
  # Long-lived branches are verified on what actually landed, not only on what
  # a pull request predicted would land.
  push:
    branches:
      - main
      - master
      - "development*"
    paths:
      - "frontend/**"
      - ".github/workflows/test-frontend.yaml"
  pull_request:
    branches:
      - main
      - master # Keep coverage while master remains the repository default branch.
      - "development*"
    paths:
      - "frontend/**"
      - ".github/workflows/test-frontend.yaml"
  workflow_dispatch:

concurrency:
  group: frontend-tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  unit:
    name: Unit and component tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # frontend/package.json declares engines.node >= 22, and the frontend
          # image builds on node:22-alpine.
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run the unit suite
        run: npm run test:coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  e2e:
    name: E2E and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      # Must match @playwright/test in frontend/package.json exactly — a
      # mismatch fails with "Executable doesn't exist at /ms-playwright/…".
      # Bump the two together.
      #
      # Running in the container is what makes the a11y node counts
      # reproducible: it is the same image e2e/in-container.sh uses locally,
      # so fonts and Chromium match rather than differing per machine.
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      # Chromium dies on the default 64MB /dev/shm.
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Behaviour at the three viewport regimes, plus the a11y ratchet: these
      # assert through data-testid and user-visible text (a11y through axe),
      # which survive restyling by design, so they gate every push and PR.
      #
      # The visual (screenshot) suite is NOT here — it moved to
      # .github/workflows/build_and_test.yml, gated on a published release
      # rather than on every push/PR. This workflow gates nothing on its own
      # (deploy.yml only watches the "Integration Tests" workflow), so a
      # pixel-diff check belongs in the pipeline that actually decides
      # whether a release ships, not in this one.
      - name: Run the behavioural and accessibility suites
        run: npx playwright test --project=desktop --project=tablet --project=mobile --project=a11y
        env:
          CI: "true"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
