name: Frontend Tests

on:
  pull_request:
    branches:
      - main
      - master # Keep coverage while master remains the repository default branch.
      - "development*"
    paths:
      - "frontend/**"
      - ".github/workflows/test-frontend.yaml"
  workflow_dispatch:

concurrency:
  group: frontend-tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  unit:
    name: Unit and component tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # frontend/package.json declares engines.node >= 22, and the frontend
          # image builds on node:22-alpine.
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run the unit suite
        run: npm run test:coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  e2e:
    name: E2E behaviour (visual and accessibility advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      # Must match @playwright/test in frontend/package.json exactly — a
      # mismatch fails with "Executable doesn't exist at /ms-playwright/…".
      # Bump the two together.
      #
      # Running in the container is what makes the screenshot baselines
      # reproducible: it is the same image `npm run test:visual:update` uses
      # locally, so fonts and Chromium match rather than differing per machine.
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      # Chromium dies on the default 64MB /dev/shm.
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # What gates a pull request: behaviour, asserted through data-testid and
      # user-visible text. Those survive restyling by design, so they stay
      # required while the UI is being reworked.
      - name: Run the behavioural suites
        run: npm run test:e2e
        env:
          CI: "true"

      # Advisory until the UI settles. The baseline is a ratchet — markup that
      # trips a rule it has not seen before is a hard failure — which is the
      # right bar for a stable interface and the wrong one for an interface
      # being rebuilt. It still runs and still reports; it just does not block.
      - name: Run the accessibility suite (advisory)
        continue-on-error: true
        run: npx playwright test --project=a11y
        env:
          CI: "true"

      # Off the pull-request path entirely. These assert pixels against
      # committed baselines, so a UI under active change makes them stale on
      # purpose, and re-recording them every commit is the slowdown this is
      # meant to avoid. Run them from a manual dispatch when a change is worth
      # comparing, or locally with `npm run test:visual` (and
      # `npm run test:visual:update` to re-record).
      - name: Run the visual suite (advisory, manual runs only)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: npx playwright test --project=visual
        env:
          CI: "true"

      # always(), not failure(): the advisory steps leave the job green, and
      # their report is the only way to see what they found.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
