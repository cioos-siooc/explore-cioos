name: Unit Tests

on:
  pull_request:
    branches:
      - main
      - master # Keep coverage while master remains the repository default branch.
      - "development*"
  # Deploy is gated on the Integration Tests run for the pushed commit; these
  # run on the same pushes so a deployable branch always has both results.
  push:
    branches:
      - master
      - development
  workflow_dispatch:

jobs:
  unit-tests:
    name: Python unit tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.8"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run all unit tests
        run: uv run pytest python-common/tests harvester/tests/unit downloader/tests

  web-api-unit-tests:
    name: Web API unit tests
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          # Matches frontend/package.json engines and frontend/Dockerfile.
          node-version: 22
          cache: npm
          cache-dependency-path: web-api/package-lock.json

      - name: Install dependencies
        working-directory: web-api
        run: npm ci --quiet

      - name: Run web-api unit tests
        working-directory: web-api
        run: npm run test:unit

      - name: Run web-api route-contract tests
        working-directory: web-api
        run: npm run test:contract

  frontend-unit-tests:
    name: Frontend unit tests
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          # Matches frontend/package.json engines and frontend/Dockerfile.
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --quiet

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test
