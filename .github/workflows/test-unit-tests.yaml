name: Unit Tests

on:
  pull_request:
    branches:
      - main
      - master # Keep coverage while master remains the repository default branch.
      - "development*"
  workflow_dispatch:

jobs:
  unit-tests:
    name: Python unit tests
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.8"

      - name: Install dependencies
        run: uv sync --locked

      - name: Run all unit tests
        run: uv run pytest harvester/tests/unit downloader/tests
