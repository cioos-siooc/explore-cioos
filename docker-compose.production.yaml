# Production OVERLAY — non-Coolify, self-hosted. Not standalone; layers on the
# base file and holds only what production adds:
#
#   docker compose -f docker-compose.yaml -f docker-compose.production.yaml up -d --build
#
# .env sets COMPOSE_FILE so plain `docker compose` does the same. No profile is
# needed any more: `scheduler` was profiled `tools` in the base file, which made
# the download-queue consumer opt-in and left Coolify deploys without one.
services:
  db:
    ports:
      # Bound to one interface, not 0.0.0.0. This port IS needed here: the
      # harvester and any remote prefect_worker run outside this compose
      # project and reach Postgres over the VPN at DB_HOST_EXTERNAL
      # (docker-compose.worker.yaml). Published bare, though, it also listened
      # on every other interface of the host — inverted from local dev, which
      # deliberately publishes nothing.
      #
      # DB_BIND_ADDRESS should be the host's VPN address (the same one
      # DB_HOST_EXTERNAL points at). It defaults to loopback so a host that
      # forgets to set it fails closed rather than exposing the database.
      - "${DB_BIND_ADDRESS:-127.0.0.1}:${DB_PORT:-5432}:${DB_PORT:-5432}"

  nginx:
    ports:
      - "${NGINX_PORT:-8098}:4000"

  frontend:
    build:
      args:
        ENVIRONMENT: $ENVIRONMENT
        SENTRY_RELEASE: $SENTRY_RELEASE
        SENTRY_ORG: $SENTRY_ORG
        SENTRY_PROJECT: $SENTRY_PROJECT
      # SENTRY_AUTH_TOKEN is no longer a build ARG: as an ARG promoted to ENV it
      # stayed recoverable from the image with `docker history`/`inspect`. As a
      # secret it is mounted only for the `npm run build` layer that uploads
      # source maps. Requires Compose >= 2.23 for the `environment:` source.
      secrets:
        - sentry_auth_token

  prefect:
    ports:
      - "${PREFECT_PORT:-4200}:4200"

  scheduler:
    environment:
      # Base derives this from Coolify's SERVICE_URL_NGINX; here that would
      # expand to a bare "/downloads".
      - "DOWNLOAD_WAF_URL=${DOWNLOAD_WAF_URL}"

  prefect_worker:
    # Name it for `docker save` to a second harvest host (docker-compose.worker.yaml).
    image: cde-harvester:latest
    environment:
      # Base hardcodes `db`; production may target a DB across the VPN.
      DB_HOST_EXTERNAL: ${DB_HOST_EXTERNAL:-db}
    volumes:
      # Host-editable. A changed server list needs `restart prefect_worker`.
      - ./harvest_config.yaml:/app/harvester/harvest_config.yaml:ro

  redis:
    # Bound the cache (100mb, allkeys-lfu) so it can't compete with Postgres.
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./redis-config/redis.conf:/usr/local/etc/redis/redis.conf:ro

# Build-time only. Read from the deploy environment (deploy.yml resolves it
# from 1Password into .env), never written into an image layer.
secrets:
  sentry_auth_token:
    environment: SENTRY_AUTH_TOKEN

# Project default => every service joins it, including inherited ones.
# Must exist: docker network create explore-cioos_default
networks:
  default:
    name: explore-cioos_default
    external: true
