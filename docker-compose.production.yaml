# Production OVERLAY — non-Coolify, self-hosted. Not standalone; layers on the
# base file and holds only what production adds:
#
#   docker compose -f docker-compose.yaml -f docker-compose.production.yaml up -d --build
#
# .env sets COMPOSE_FILE so plain `docker compose` does the same.
services:
  db:
    ports:
      # Published for remote harvest workers reaching Postgres over the VPN
      # (docker-compose.worker.yaml), but bound to one interface, not 0.0.0.0.
      # DB_BIND_ADDRESS should be the host's VPN address (the one
      # DB_HOST_EXTERNAL points at); it defaults to loopback so a host that
      # forgets to set it fails closed.
      - "${DB_BIND_ADDRESS:-127.0.0.1}:${DB_PORT:-5432}:${DB_PORT:-5432}"

  nginx:
    ports:
      - "${NGINX_PORT:-8098}:4000"

  prefect:
    ports:
      - "${PREFECT_PORT:-4200}:4200"

  prefect_worker:
    # Name it for `docker save` to a second harvest host (docker-compose.worker.yaml).
    image: cde-harvester:latest
    environment:
      # Base hardcodes `db`; production may target a DB across the VPN.
      DB_HOST_EXTERNAL: ${DB_HOST_EXTERNAL:-db}
    volumes:
      # Host-editable. A changed server list needs `restart prefect_worker`.
      - ${HARVEST_CONFIG_HOST_FILE:-./harvest_config.yaml}:/app/harvester/harvest_config.yaml:ro

  redis:
    # Bound the cache (see redis-config/redis.conf) so it can't compete with Postgres.
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - ./redis-config/redis.conf:/usr/local/etc/redis/redis.conf:ro
