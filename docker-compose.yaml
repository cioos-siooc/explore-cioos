# Base compose file — publishes NO host ports by design.
#
# This is the single file deployed by Coolify (point the Coolify resource at
# docker-compose.yaml): its proxy reaches nginx on container port 4000 over the
# internal docker network via SERVICE_FQDN_NGINX_4000, so host ports would only
# collide. For standalone local development, host ports (nginx / prefect) come
# from docker-compose.override.yaml — see docker-compose.override.yaml.sample.
# For non-Coolify production, use docker-compose.production.yaml.
# The single .env every service reads.
x-env-file: &env-file
  - .env

# --- The public URL of the site ----------------------------------------------
# Anything that has to produce a link usable from OUTSIDE the compose network
# (download emails, the OpenAPI "servers" entry) resolves it from one chain:
#
#   ${SERVICE_URL_NGINX:-${APP_URL:-http://localhost:${NGINX_PORT:-8098}}}
#
#   1. SERVICE_URL_NGINX  injected by Coolify once nginx has an FQDN
#   2. APP_URL            set it for any other public deployment; the ONLY
#                         URL that ever needs configuring
#   3. http://localhost:${NGINX_PORT:-8098}   local dev, derived from the one
#                         port the override/production files publish
#
# So local dev needs nothing, and a self-hosted deployment needs APP_URL (plus
# NGINX_PORT if 8098 is taken). YAML anchors hold whole values, not string
# fragments, so the chain is spelled out at each use rather than shared.

# Database connection, identical for every service that talks to Postgres.
# Delivered by compose interpolation as well as `env_file`: Coolify reliably
# populates interpolation, but the .env that `env_file` reads can be absent or
# empty on a deployment.
#
# DB_PASSWORD deliberately has no default: the production overlay PUBLISHES this
# port on the host, so a default would be a real credential shipped in git. The
# `:?` guard lives only here and on the `db` service; every other reference is
# reached through one of the two.
x-db-env: &db-env
  DB_HOST: db
  DB_NAME: ${DB_NAME:-cde}
  DB_USER: ${DB_USER:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:?required — run ./scripts/init-dev-env.sh, or set it in .env}
  DB_PORT: ${DB_PORT:-5432}

services:
  db:
    restart: unless-stopped
    build: ./database
    platform: linux/x86_64
    # Parallel workers allocate shared memory in /dev/shm; Docker's 64MB default
    # gets overrun and Postgres reports "No space left on device".
    shm_size: 1gb
    # log_lock_waits: near-zero cost, and makes db-loader vs web-api lock
    # contention diagnosable straight from `docker logs`.
    command: ["postgres", "-c", "log_lock_waits=on"]
    environment:
      # Postgres' own variable names, so this service cannot use *db-env; the
      # values behind them are the same, defaults included.
      - "PGPORT=${DB_PORT:-5432}"
      - "POSTGRES_DB=${DB_NAME:-cde}"
      - "POSTGRES_PASSWORD=${DB_PASSWORD:?required — run ./scripts/init-dev-env.sh, or set it in .env}"
      - "POSTGRES_USER=${DB_USER:-postgres}"
    volumes:
      # Postgres 18 images keep PGDATA in a versioned subdirectory
      # (/var/lib/postgresql/18/docker) and refuse a mount at .../data. The
      # volume is named for the major so a pre-18 volume is never opened by
      # an 18 server; dump/restore or re-harvest into the new one.
      - postgres18-data:/var/lib/postgresql
    healthcheck:
      # Probe over TCP (-h 127.0.0.1), NOT the default Unix socket: on a fresh
      # volume the init scripts run behind a socket-only temporary server, so a
      # socket probe reports healthy while TCP dependents still get
      # ConnectionRefused.
      test: ["CMD", "pg_isready", "-q", "-d", "${DB_NAME:-cde}", "-U", "${DB_USER:-postgres}", "-h", "127.0.0.1", "-p", "${DB_PORT:-5432}"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Fresh-volume init runs initdb + PostGIS + all init scripts behind a
      # socket-only temp server; measured ~134s to TCP-ready on slow disk. Keep
      # the grace well above that so expected early failures don't mark unhealthy.
      start_period: 180s

  # One-shot: re-applies the numbered function files (3_*.sql .. 9_*.sql)
  # before any other service touches the DB, so a live DB picks up
  # stored-procedure changes on every `up`. 1_schema.sql is NEVER applied here
  # (it DROPs tables).
  db_migrate:
    image: postgres:18-alpine
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    environment:
      # psql's own variable names; same values as *db-env (whose `:?` guard has
      # already run by the time this is reached).
      PGHOST: db
      PGPORT: ${DB_PORT:-5432}
      PGUSER: ${DB_USER:-postgres}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_NAME:-cde}
    volumes:
      - ./database:/database:ro
    command:
      - sh
      - -c
      - |
        set -e
        applied=0
        for f in /database/[3-9]_*.sql; do
          [ -e "$$f" ] || continue
          echo "Applying: $$f"
          psql -v ON_ERROR_STOP=1 -f "$$f"
          applied=$$((applied+1))
        done
        echo "SQL files applied: $$applied"

  web-api:
    build: ./web-api
    restart: always
    env_file: *env-file
    environment:
      # Docker-network service names so the API reaches Postgres/Redis without a
      # repo .env, plus the credentials by interpolation — see *db-env above.
      <<: *db-env
      REDIS_HOST: redis
      # Server URL shown in the Swagger UI and openapi.json.
      PUBLIC_BASE_URL: ${SERVICE_URL_NGINX:-${APP_URL:-http://localhost:${NGINX_PORT:-8098}}}/api
      # The commit the download script pins the downloader to (deploy.yml and
      # Coolify set it); unset, scripts track development-v2.
      SOURCE_COMMIT: ${SOURCE_COMMIT:-}
    expose:
      - "5000"
    depends_on:
      db_migrate:
        condition: service_completed_successfully
  nginx:
    restart: unless-stopped
    build:
        context: ./nginx
        dockerfile: Dockerfile
    volumes:
      - nginx_logs:/var/log/nginx
      - nginx_logrotate:/var/lib/logrotate
      - harvester_logs:/usr/share/nginx/html/harvester_logs:ro
      - downloads:/usr/share/nginx/html/downloads:ro
    environment:
      # Coolify "magic" var: tells Coolify to generate a public FQDN for this
      # service and proxy it to container port 4000. Inert outside Coolify.
      - SERVICE_FQDN_NGINX_4000
    # Gate on health, not creation, or deploys serve 502s while web-api starts.
    depends_on:
      web-api:
        condition: service_healthy
      frontend:
        condition: service_healthy
  scheduler:
    build:
      context: .
      dockerfile: ./download_scheduler/Dockerfile
    # NOT behind a compose profile: Coolify never sets COMPOSE_PROFILES, so the
    # queue would have no consumer and downloads would stay 'open' forever.
    restart: unless-stopped
    depends_on:
      db_migrate:
        condition: service_completed_successfully
    env_file: *env-file
    environment:
      # download_scheduler.py reads envs["DB_HOST"] at import.
      <<: *db-env
      # Emailed download links must work from outside the compose network.
      # `environment:` beats `env_file:`, so a DOWNLOAD_WAF_URL in .env is ignored.
      DOWNLOAD_WAF_URL: ${SERVICE_URL_NGINX:-${APP_URL:-http://localhost:${NGINX_PORT:-8098}}}/downloads
      # Makes each download a Prefect flow run; delete to turn that off.
      # Hardcoded, NOT ${PREFECT_API_URL}: .env sets that to localhost:4200 for
      # host-side CLI use, which would point the container at itself.
      PREFECT_API_URL: http://prefect:4200/api
    volumes:
      - downloads:/usr/src/app/download_scheduler/downloads
  frontend:
    restart: unless-stopped
    build:
      # Repo root, not ./frontend: the harvest docs page bundles docs/harvesting.
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Default to a same-origin relative path so the SPA works on whatever
        # public hostname serves it without a rebuild.
        API_URL: ${API_URL:-/api}
        BASE_URL: ${BASE_URL:-/}
        # Same DSN web-api uses; empty leaves Sentry inert in the browser.
        # Needed at BUILD time here (vite bakes it in), not at runtime.
        SENTRY_DSN: ${SENTRY_DSN:-}
        ENVIRONMENT: ${ENVIRONMENT:-}
        # Optional: sourcemap upload + release tagging. Empty ORG/PROJECT/
        # RELEASE leave the Sentry plugin inert; see .env.sample.
        SENTRY_RELEASE: ${SENTRY_RELEASE:-}
        SENTRY_ORG: ${SENTRY_ORG:-}
        SENTRY_PROJECT: ${SENTRY_PROJECT:-}
      # SENTRY_AUTH_TOKEN is a secret, not a build ARG: an ARG stays recoverable
      # from the image with `docker history`. Requires Compose >= 2.23 for the
      # `environment:` secret source below; unset => upload is skipped.
      secrets:
        - sentry_auth_token
    expose:
      - "80"
  # Prefect PROCESS worker: runs harvest flows in-process (no spawned flow-run
  # containers, no docker socket). On startup it registers the work pool +
  # deployments (REGISTER_DEPLOYMENTS=true), optionally fires one harvest
  # (RUN_ON_DEPLOY), then polls the cde-process-pool. Scale with:
  #   docker compose up -d --scale prefect_worker=N
  # (registration is idempotent + best-effort, so extra replicas are safe).
  # To run a worker on another host, see docker-compose.worker.yaml.
  prefect_worker:
    build:
      context: .
      dockerfile: ./harvester/Dockerfile
    depends_on:
      prefect:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped
    command: ["./worker-entrypoint.sh"]
    healthcheck:
      # Prefect's worker webserver (--with-healthcheck in worker-entrypoint.sh).
      # In compose, not the image: the image's own CMD runs no worker. The long
      # grace covers deployment registration, which runs before the worker.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 300s
    volumes:
      # The harvest config is neither bind-mounted nor baked; provide it at
      # runtime (a relative bind-mount resolves to an empty dir under Coolify):
      #   - under Coolify: set HARVEST_CONFIG_B64 to the YAML base64-encoded on
      #     ONE line (`base64 < harvest_config.yaml | tr -d '\n'`); Coolify's env
      #     editor mangles raw multi-line YAML. Or add a Persistent Storage FILE
      #     mount onto /app/harvester/harvest_config.yaml;
      #   - locally: mount ./harvest_config.yaml via docker-compose.override.yaml
      #     (see docker-compose.override.yaml.sample).
      # Re-read on every start and flow run, so updates never need a rebuild.
      # Shared output sinks — every replica on this host writes here, and nginx
      # serves harvester_logs read-only at /harvester_logs.
      - harvest_data:/app/harvester/harvest
      - harvester_logs:/app/harvester/logs
      # Caches persisted across runs (cheap re-fetch if lost).
      - harvester_cache:/app/harvester/harvester_cache
      - obis_cache:/app/harvester/obis_cache
    env_file: *env-file
    environment:
      PREFECT_API_URL: http://prefect:4200/api
      PREFECT_LOGGING_LEVEL: INFO
      HARVEST_CONFIG_FILE: /app/harvester/harvest_config.yaml
      # In-process flows inherit this container's env for DB / redis access.
      # The harvester reads DB_HOST_EXTERNAL rather than DB_HOST (it also runs
      # outside compose); the production overlay repoints it across the VPN.
      <<: *db-env
      DB_HOST_EXTERNAL: db
      REDIS_HOST: redis
      HARVESTER_LOG_DIR: /app/harvester/logs
      # Surface stdlib-logging from harvester/db-loader in Prefect UI logs.
      PREFECT_LOGGING_EXTRA_LOGGERS: populate_vernaculars,cde_harvester
      # This worker registers the pool + deployments on startup.
      REGISTER_DEPLOYMENTS: "true"
      # Optional: fire a harvest on (re)deploy. Off by default.
      #   false = never; true/once = only when the DB is empty (new install);
      #   always = every deploy, regardless of DB contents.
      RUN_ON_DEPLOY: ${RUN_ON_DEPLOY:-false}
      # Cap concurrent flow runs: harvest-all fans out one OS process per
      # source. Budget against mem_limit below, not CPU: each run is its own
      # pandas working set, and 6 OOM'd the container. Raise it together with
      # HARVESTER_MEM_LIMIT.
      HARVEST_WORKER_LIMIT: ${HARVEST_WORKER_LIMIT:-3}
    # memswap_limit == mem_limit gives this container ZERO swap, so a runaway
    # harvest is OOM-killed in its own cgroup instead of grinding through host
    # swap (which once livelocked the box until a hard reboot). Keep both
    # defaults equal: memswap_limit is memory PLUS swap. No mem_swappiness: it
    # is cgroup v1 only and Compose drops it on these cgroup v2 hosts.
    mem_limit: ${HARVESTER_MEM_LIMIT:-6g}
    memswap_limit: ${HARVESTER_MEM_LIMIT:-6g}

  prefect:
    # Non-conda image: ships asyncpg, so Prefect can use Postgres as its
    # metadata DB. SQLite (the default) throws "database is locked" under the
    # concurrent access from scaled / remote workers — Postgres handles it.
    image: prefecthq/prefect:3.8-python3.14
    # On startup, create the dedicated `prefect` database in the shared `db`
    # Postgres if it doesn't exist (idempotent; works on fresh AND existing
    # volumes, including Coolify where initdb scripts won't re-run), then start
    # the server. Prefect runs its own schema migrations against it.
    command:
      - sh
      - -c
      - |
        python - <<'PY'
        import asyncio, os, asyncpg
        async def ensure_db():
            # Wait for Postgres to accept TCP: on a fresh volume the init scripts
            # run behind a socket-only temporary server (see the db healthcheck).
            last = None
            for attempt in range(1, 151):
                try:
                    conn = await asyncpg.connect(
                        host="db", port=int(os.environ.get("DB_PORT", "5432")),
                        user=os.environ["DB_USER"], password=os.environ["DB_PASSWORD"],
                        database=os.environ["DB_NAME"],
                    )
                except (OSError, asyncpg.PostgresError) as e:
                    last = e
                    print(f"[prefect-init] db not ready over TCP (attempt {attempt}/150): {e!r}", flush=True)
                    await asyncio.sleep(2)
                    continue
                try:
                    if not await conn.fetchval("SELECT 1 FROM pg_database WHERE datname='prefect'"):
                        await conn.execute("CREATE DATABASE prefect")
                        print("[prefect-init] created 'prefect' database", flush=True)
                    else:
                        print("[prefect-init] 'prefect' database already exists", flush=True)
                    return
                finally:
                    await conn.close()
            raise SystemExit(f"[prefect-init] FATAL: db never became reachable over TCP: {last!r}")
        asyncio.run(ensure_db())
        PY
        exec prefect server start --host 0.0.0.0
    env_file: *env-file
    environment:
      # The init script above reads DB_USER / DB_PASSWORD / DB_NAME directly.
      <<: *db-env
      # Under Coolify: declare a domain for the UI (port 4200) so the proxy
      # routes to it, mirroring SERVICE_FQDN_NGINX_4000 on nginx. Empty value =>
      # Coolify auto-generates an FQDN; set a value in the UI to pin it. Inert
      # outside Coolify (base compose still publishes no host ports).
      SERVICE_FQDN_PREFECT_4200:
      # Use the shared Postgres (db service), isolated in its own `prefect` DB.
      # DB_PASSWORD is guarded by *db-env above.
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://${DB_USER:-postgres}:${DB_PASSWORD}@db:${DB_PORT:-5432}/prefect
      PREFECT_API_URL: http://127.0.0.1:4200/api
      # Same-origin API calls from the UI: PREFECT_API_URL points at the
      # container's own loopback, which fails silently in the browser.
      PREFECT_UI_API_URL: /api
      # Coolify injects SERVICE_URL_PREFECT (the public URL) once the FQDN above
      # is declared; falls back to the locally published port, which is the same
      # PREFECT_PORT the override/production files map.
      PREFECT_UI_URL: ${SERVICE_URL_PREFECT:-http://localhost:${PREFECT_PORT:-4200}}
      PREFECT_HOME: /root/.prefect
    volumes:
      - prefect_data:/root/.prefect
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  redis:
    restart: unless-stopped
    # Pinned. `redis:alpine` is a floating tag: the cache could cross a major
    # version on any rebuild.
    image: redis:8.10-alpine
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3


volumes:
  postgres18-data:
  prefect_data:
  nginx_logs:
  nginx_logrotate:
  harvester_logs:
  downloads:
  harvester_cache:
  harvest_data:
  obis_cache:

# Build-time only. Read from the deploy environment (Coolify's own env vars,
# or .env via deploy.yml resolving it from 1Password), never written into an
# image layer.
secrets:
  sentry_auth_token:
    environment: SENTRY_AUTH_TOKEN
