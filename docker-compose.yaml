# Base compose file — publishes NO host ports by design.
#
# This is the single file deployed by Coolify (point the Coolify resource at
# docker-compose.yaml): its proxy reaches nginx on container port 4000 over the
# internal docker network via SERVICE_FQDN_NGINX_4000, so host ports would only
# collide. For standalone local development, host ports (nginx / prefect) come
# from docker-compose.override.yaml — see docker-compose.override.yaml.sample.
# For non-Coolify production, use docker-compose.production.yaml.
services:
  db:
    build: ./database
    platform: linux/x86_64
    # Postgres parallel workers (e.g. VACUUM ANALYZE / parallel scans on
    # cde.trajectory_hexes) allocate shared-memory segments in /dev/shm. The
    # Docker default is 64MB, which parallel maintenance overruns — Postgres
    # then reports it as "DiskFull / No space left on device". Raise it well
    # above the working-set size.
    shm_size: 1gb
    # log_lock_waits: log any session that waits >deadlock_timeout (1s) for a
    # lock, with holder/waiter pids. Near-zero cost; makes lock contention
    # between the harvester's db-loader and live web-api reads diagnosable
    # straight from `docker logs` instead of reconstructing it after the fact.
    command: ["postgres", "-c", "log_lock_waits=on"]
    environment:
      - "PGPORT=${DB_PORT:-5432}"
      - "POSTGRES_DB=$DB_NAME"
      - "POSTGRES_PASSWORD=$DB_PASSWORD"
      - "POSTGRES_USER=$DB_USER"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Probe over TCP (-h 127.0.0.1), NOT the default Unix socket. On a fresh
      # volume the entrypoint runs initdb + /docker-entrypoint-initdb.d/*.sql
      # behind a temporary server that listens on the local socket ONLY, so a
      # socket-based pg_isready reports "healthy" while TCP 5432 still refuses
      # connections. Dependents (prefect, db_migrate, web-api) then connect over
      # TCP too early and crash with ConnectionRefused. Forcing TCP here keeps
      # service_healthy false until the real server is actually accepting TCP.
      test: ["CMD", "pg_isready", "-q", "-d", "${DB_NAME}", "-U", "${DB_USER}", "-h", "127.0.0.1", "-p", "${DB_PORT:-5432}"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Fresh-volume init runs initdb + PostGIS + all init scripts behind a
      # socket-only temp server; measured ~134s to TCP-ready on slow disk. Keep
      # the grace well above that so expected early failures don't mark unhealthy.
      start_period: 180s

  # One-shot: re-applies the numbered function files (3_*.sql .. 9_*.sql)
  # before any other service reads or writes the DB. They are pure CREATE OR
  # REPLACE FUNCTION, so a live DB picks up stored-procedure changes on every
  # `up`. Schema (table) changes are NOT migrated: 1_schema.sql only runs on a
  # fresh volume (docker-entrypoint-initdb.d) — a schema change means dropping
  # the volume and re-harvesting. 1_schema.sql is NEVER applied here (it DROPs
  # tables). Exits cleanly once done ("Exited (0)").
  db_migrate:
    image: postgres:13-alpine
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    environment:
      PGHOST: db
      PGPORT: ${DB_PORT:-5432}
      PGUSER: $DB_USER
      PGPASSWORD: $DB_PASSWORD
      PGDATABASE: $DB_NAME
    volumes:
      - ./database:/database:ro
    command:
      - sh
      - -c
      - |
        set -e
        applied=0
        for f in /database/[3-9]_*.sql; do
          [ -e "$$f" ] || continue
          echo "Applying: $$f"
          psql -v ON_ERROR_STOP=1 -f "$$f"
          applied=$$((applied+1))
        done
        echo "SQL files applied: $$applied"

  web-api:
    build: ./web-api
    restart: always
    env_file:
      - .env
    environment:
      # Docker-network service names so the API reaches Postgres/Redis without a
      # repo .env (Coolify supplies DB_NAME/USER/PASSWORD/PORT but not the hosts).
      # web-api/db.js reads DB_HOST and utils/redis.js reads REDIS_HOST; both
      # default to localhost when unset. Mirrors the prefect_worker service.
      DB_HOST: db
      REDIS_HOST: redis
    expose:
      - "5000"
    depends_on:
      db_migrate:
        condition: service_completed_successfully
  nginx:
    build:
        context: ./nginx
        dockerfile: Dockerfile
    volumes:
      - nginx_logs:/var/log/nginx
      - nginx_logrotate:/var/lib/logrotate
      - harvester_logs:/usr/share/nginx/html/harvester_logs:ro
      - downloads:/usr/share/nginx/html/downloads:ro
    environment:
      # Coolify "magic" var: tells Coolify to generate a public FQDN for this
      # service and proxy it to container port 4000. Inert outside Coolify.
      - SERVICE_FQDN_NGINX_4000
    depends_on:
      - web-api
  scheduler:
    build:
      context: .
      dockerfile: ./download_scheduler/Dockerfile
    profiles:
      - tools
    # Without this, a crash leaves the queue with no consumer: the API keeps
    # accepting downloads and they pile up as 'open' rows forever.
    restart: unless-stopped
    depends_on:
      db_migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      # Under Coolify, SERVICE_URL_NGINX is injected with nginx's public URL;
      # elsewhere it is unset and APP_DOMAIN from .env is used.
      - "DOWNLOAD_WAF_URL=${SERVICE_URL_NGINX:-${APP_DOMAIN}}/downloads"
      # Same reason as web-api: Coolify supplies DB_NAME/USER/PASSWORD/PORT but
      # not the host. download_scheduler.py reads envs["DB_HOST"] unconditionally
      # at import, so without this the module raises KeyError before it can poll
      # and the container crash-loops on restart: unless-stopped.
      - "DB_HOST=db"
    volumes:
      - downloads:/usr/src/app/download_scheduler/downloads
  frontend:
    build:
      context: ./frontend
      args:
        # Default to a same-origin relative path so the SPA works on whatever
        # public hostname serves it without a rebuild.
        API_URL: ${API_URL:-/api}
        BASE_URL: ${BASE_URL:-/}
    expose:
      - "80"
  # Prefect PROCESS worker: runs harvest flows in-process (no spawned flow-run
  # containers, no docker socket). On startup it registers the work pool +
  # deployments (REGISTER_DEPLOYMENTS=true), optionally fires one harvest
  # (RUN_ON_DEPLOY), then polls the cde-process-pool. Scale with:
  #   docker compose up -d --scale prefect_worker=N
  # (registration is idempotent + best-effort, so extra replicas are safe).
  # To run a worker on another host, see docker-compose.worker.yaml.
  prefect_worker:
    build:
      context: .
      dockerfile: ./harvester/Dockerfile
    depends_on:
      prefect:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped
    command: ["./worker-entrypoint.sh"]
    volumes:
      # NOTE: the harvest config is NOT bind-mounted here, and the image does
      # NOT bake one — it must be provided at runtime (startup fails with
      # instructions otherwise). A relative bind-mount of a repo file doesn't
      # work under Coolify (it resolves the source to an empty
      # persistent-storage dir and fails "mount dir onto file"), so:
      #   - under Coolify: set the HARVEST_CONFIG_B64 env var to the whole YAML
      #     file base64-encoded on ONE line (applied on redeploy/recreate) —
      #     generate it with `base64 < harvest_config.yaml | tr -d '\n'`. Raw
      #     multi-line YAML in an env var does NOT survive Coolify's env editor
      #     (it reindents continuations and mangles `#` comments), which is why
      #     the value is base64. Or add a Persistent Storage FILE mount onto
      #     /app/harvester/harvest_config.yaml to keep it UI-editable;
      #   - locally: mount ./harvest_config.yaml via docker-compose.override.yaml
      #     (see docker-compose.override.yaml.sample).
      # Config is re-read on every container start (deployments re-register) and
      # on every flow run, so updates never require an image rebuild.
      # Shared output sinks — every replica on this host writes here, and nginx
      # serves harvester_logs read-only at /harvester_logs.
      - harvest_data:/app/harvester/harvest          # resulting CSV files
      - harvester_logs:/app/harvester/logs           # log files
      # Caches persisted across runs (cheap re-fetch if lost).
      - harvester_cache:/app/harvester/harvester_cache
      - obis_cache:/app/harvester/obis_cache
    env_file:
      - .env
    environment:
      PREFECT_API_URL: http://prefect:4200/api
      PREFECT_LOGGING_LEVEL: INFO
      HARVEST_CONFIG_FILE: /app/harvester/harvest_config.yaml
      # In-process flows inherit this container's env for DB / redis access.
      DB_HOST_EXTERNAL: db
      REDIS_HOST: redis
      HARVESTER_LOG_DIR: /app/harvester/logs
      # Surface stdlib-logging from harvester/db-loader in Prefect UI logs.
      PREFECT_LOGGING_EXTRA_LOGGERS: populate_vernaculars,cde_db_loader,cde_harvester
      # This worker registers the pool + deployments on startup.
      REGISTER_DEPLOYMENTS: "true"
      # Optional: fire a harvest on (re)deploy. Off by default.
      #   false = never; true/once = only when the DB is empty (new install);
      #   always = every deploy, regardless of DB contents.
      RUN_ON_DEPLOY: ${RUN_ON_DEPLOY:-false}
      # Cap concurrent flow runs. The harvest-all flow fans out one child run
      # per source (10+ of them); each is its own OS process under
      # `--type process`. Unbounded, they exhausted a 15.7 GB host on
      # 2026-08-04. See HARVEST_WORKER_LIMIT in worker-entrypoint.sh.
      HARVEST_WORKER_LIMIT: ${HARVEST_WORKER_LIMIT:-6}
    # Resource containment. Setting memswap_limit == mem_limit gives this
    # container ZERO swap (cgroup v2: memory.swap.max = memswap_limit -
    # mem_limit = 0), so a runaway harvest is OOM-killed inside its own cgroup
    # in seconds instead of consuming host swap.
    # On 2026-08-04 an unbounded harvest filled all 8.6 GB of host swap and
    # livelocked the box for ~90 min: with swap to grind through, the kernel
    # kept reclaiming, so the OOM killer never fired and nothing recovered
    # until a hard reboot. A contained OOM kill is noisy but self-recovering
    # (restart: unless-stopped above).
    # NOTE: deliberately no mem_swappiness — that is cgroup v1 only, and these
    # hosts are cgroup v2, where Compose silently drops it. memswap_limit is
    # what actually disables swap here.
    mem_limit: ${HARVESTER_MEM_LIMIT:-6g}
    memswap_limit: ${HARVESTER_MEM_LIMIT:-10g}

  prefect:
    # Non-conda image: ships asyncpg, so Prefect can use Postgres as its
    # metadata DB. SQLite (the default) throws "database is locked" under the
    # concurrent access from scaled / remote workers — Postgres handles it.
    image: prefecthq/prefect:3.6-python3.12
    # On startup, create the dedicated `prefect` database in the shared `db`
    # Postgres if it doesn't exist (idempotent; works on fresh AND existing
    # volumes, including Coolify where initdb scripts won't re-run), then start
    # the server. Prefect runs its own schema migrations against it.
    command:
      - sh
      - -c
      - |
        python - <<'PY'
        import asyncio, os, asyncpg
        async def ensure_db():
            # Wait for Postgres to accept TCP before starting the server. On a
            # FRESH volume the db entrypoint runs initdb + the init *.sql scripts
            # behind a temporary server bound to the local Unix socket ONLY, so
            # pg_isready / the db healthcheck can report ready while TCP 5432 is
            # still refusing connections. Connecting (or running Alembic) in that
            # window dies with ConnectionRefused, so retry until TCP is truly up.
            last = None
            for attempt in range(1, 151):
                try:
                    conn = await asyncpg.connect(
                        host="db", port=int(os.environ.get("DB_PORT", "5432")),
                        user=os.environ["DB_USER"], password=os.environ["DB_PASSWORD"],
                        database=os.environ["DB_NAME"],
                    )
                except (OSError, asyncpg.PostgresError) as e:
                    last = e
                    print(f"[prefect-init] db not ready over TCP (attempt {attempt}/150): {e!r}", flush=True)
                    await asyncio.sleep(2)
                    continue
                try:
                    if not await conn.fetchval("SELECT 1 FROM pg_database WHERE datname='prefect'"):
                        await conn.execute("CREATE DATABASE prefect")
                        print("[prefect-init] created 'prefect' database", flush=True)
                    else:
                        print("[prefect-init] 'prefect' database already exists", flush=True)
                    return
                finally:
                    await conn.close()
            raise SystemExit(f"[prefect-init] FATAL: db never became reachable over TCP: {last!r}")
        asyncio.run(ensure_db())
        PY
        exec prefect server start --host 0.0.0.0
    env_file:
      - .env  # DB_USER / DB_PASSWORD / DB_NAME / DB_PORT for the connection URL
    environment:
      # Under Coolify: declare a domain for the UI (port 4200) so the proxy
      # routes to it, mirroring SERVICE_FQDN_NGINX_4000 on nginx. Empty value =>
      # Coolify auto-generates an FQDN; set a value in the UI to pin it. Inert
      # outside Coolify (base compose still publishes no host ports).
      SERVICE_FQDN_PREFECT_4200:
      # Use the shared Postgres (db service), isolated in its own `prefect` DB.
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@db:${DB_PORT:-5432}/prefect
      PREFECT_API_URL: http://127.0.0.1:4200/api
      # Tell the UI's JavaScript to make API calls same-origin (i.e., through
      # whatever proxy/domain the user is reaching the UI from). Without this,
      # the UI tries to hit PREFECT_API_URL directly from the browser, which
      # points at the container's own loopback and fails silently. Relative
      # path works on local + remote Coolify without knowing the FQDN.
      PREFECT_UI_API_URL: /api
      # Coolify injects SERVICE_URL_PREFECT (the public URL) once the FQDN above
      # is declared; falls back to loopback for standalone local runs.
      PREFECT_UI_URL: ${SERVICE_URL_PREFECT:-http://localhost:4200}
      PREFECT_HOME: /root/.prefect
    volumes:
      - prefect_data:/root/.prefect
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  redis:
    image: redis:alpine
    expose:
      - "6379"


volumes:
  postgres-data:
  prefect_data:
  nginx_logs:
  nginx_logrotate:
  harvester_logs:
  downloads:
  harvester_cache:
  harvest_data:
  obis_cache:
