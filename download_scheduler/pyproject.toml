[project]
name = "download-scheduler"
version = "0.1.0"
description = "CIOOS Explorer Downloader Scheduler"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "downloader",
    "harvester",
    "jinja2>=3.1.6",
    "loguru>=0.7.3",
    "psycopg2-binary>=2.9.10",
    "python-dotenv>=1.1.1",
    "sentry-sdk>=2.38.0",
    "sqlalchemy>=2.0.0,<3.0.0"
]

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
]

[tool.uv.sources]
downloader = { path = "../downloader", editable = true }
harvester = { path = "../harvester", editable = true }
