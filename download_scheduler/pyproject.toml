[project]
name = "download-scheduler"
version = "0.1.0"
description = "CIOOS Explorer Downloader Scheduler"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    # `harvester` used to be here too, purely to reach the issue grouping and
    # the error codes — so a scheduler image installed Prefect, duckdb, redis,
    # pandera and erddapy for them. Those live in cde-python-common now.
    "cde-python-common",
    "downloader",
    "jinja2>=3.1.6",
    "loguru>=0.7.3",
    "sentry-sdk>=2.38.0",
    "sqlalchemy>=2.0.0,<3.0.0"
]

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
]

[tool.uv.sources]
cde-python-common = { path = "../python-common", editable = true }
downloader = { path = "../downloader", editable = true }
