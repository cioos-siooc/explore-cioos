<!doctype html>
<html lang="$lang">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title</title>
<style>
  /* Opened from disk, often offline: no web fonts or other external requests. */
  :root {
    --cioos-navy: #152F37;
    --cioos-primary: #52A79B;
    --cioos-primary-700: #2F6F65;
    --cioos-teal-light: #C6E3DF;
    --cioos-sand: #F3F0EC;
    --cioos-white: #FFFFFF;
    --heading: "Sora", "Montserrat", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --body: "Montserrat", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--cioos-sand);
    color: var(--cioos-navy);
    font: 400 16px/1.7 var(--body);
  }
  header {
    background: var(--cioos-white);
    border-bottom: 4px solid var(--cioos-primary);
  }
  .bar { max-width: 1040px; margin: 0 auto; padding: 16px 24px; }
  header img { height: 48px; display: block; }
  main {
    max-width: 1040px;
    margin: 32px auto;
    padding: 32px 48px 48px;
    background: var(--cioos-white);
    border: 1px solid var(--cioos-teal-light);
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(21, 47, 55, 0.08);
    overflow-wrap: anywhere;
  }
  h1, h2, h3 { font-family: var(--heading); line-height: 1.3; }
  h1 { font-size: 2rem; font-weight: 700; margin: 0 0 8px; }
  h2 {
    font-size: 1.375rem;
    font-weight: 600;
    margin: 40px 0 16px;
    padding-left: 16px;
    border-left: 4px solid var(--cioos-primary);
  }
  h1 + p { margin-top: 0; opacity: 0.8; }
  p > strong:only-child {
    display: inline-block;
    padding: 8px 16px;
    background: var(--cioos-teal-light);
    border-radius: 4px;
  }
  a { color: var(--cioos-primary-700); text-underline-offset: 2px; }
  a:hover { color: var(--cioos-navy); }
  ul { padding-left: 24px; }
  li { margin: 4px 0; }
  code {
    font: 0.875em "Courier New", ui-monospace, monospace;
    background: var(--cioos-sand);
    padding: 2px 6px;
    border-radius: 4px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin: 16px 0;
    font-size: 0.9375rem;
    display: block;
    overflow-x: auto;
  }
  th, td { text-align: left; padding: 8px 16px; border-bottom: 1px solid var(--cioos-teal-light); }
  th { font-family: var(--heading); font-weight: 600; background: var(--cioos-sand); }
  tbody tr:hover { background: rgba(198, 227, 223, 0.35); }
  footer {
    background: var(--cioos-navy);
    color: rgba(255, 255, 255, 0.8);
    font-size: 0.875rem;
  }
  footer a { color: var(--cioos-teal-light); }
  @media (max-width: 767px) {
    main { margin: 0; padding: 24px 16px; border-radius: 0; border-width: 0; }
    h1 { font-size: 1.5rem; }
  }
  @media print {
    body, main { background: var(--cioos-white); }
    main { margin: 0; padding: 0; border: 0; box-shadow: none; max-width: none; }
    footer { background: none; color: var(--cioos-navy); }
  }
</style>
</head>
<body>
<header><div class="bar"><img src="data:image/svg+xml;base64,$logo" alt="CIOOS | SIOOC"></div></header>
<main>
$body
</main>
<footer><div class="bar">CIOOS | SIOOC · <a href="https://cioos.ca">cioos.ca</a></div></footer>
</body>
</html>
