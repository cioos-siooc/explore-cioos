[project]
name = "downloader"
version = "0.1.0"
description = "CIOOS Explorer ERDDAP/OBIS downloader."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "duckdb>=1.1.0",
    "erddapy>=2.2.4",
    # Runtime, not dev: download_erddap imports cde_harvester at module scope.
    "harvester",
    "loguru>=0.7.3",
    "netcdf4>=1.7.5",
    "numpy>=2.1.0",
    "pandas>=2.2.3",
    "pyarrow>=26.0.0",
    "sentry-sdk>=2.38.0",
    "shapely>=2.1.1",
    "xarray>=2026.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["erddap_downloader"]

[tool.uv.sources]
harvester = { path = "../harvester", editable = true }


[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
]
