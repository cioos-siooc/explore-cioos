[project]
name = "downloader"
version = "0.1.0"
description = "CIOOS Explorer download scheduler service."
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "duckdb>=1.1.0",
    "erddapy>=2.2.4",
    # download_erddap imports cde_harvester at module scope, so this is a
    # runtime dependency. It was declared only in the dev group and happened to
    # resolve because download_scheduler also depends on harvester; a
    # downloader-only install (`uv sync --no-dev`) failed on import.
    "harvester",
    "loguru>=0.7.3",
    "numpy<2.0.0",
    "pandas<2.0.0",
    "pdfkit>=1.0.0",
    "sentry-sdk>=2.38.0",
    "shapely>=2.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["erddap_downloader"]

[tool.uv.sources]
harvester = { path = "../harvester", editable = true }


[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
