[project]
name = "downloader"
version = "0.1.0"
description = "CIOOS Explorer ERDDAP/OBIS downloader."
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    # The reason-code vocabulary, the issue grouping and the retry session. This
    # used to be reached through `harvester`, which meant a download image
    # installed Prefect, redis and pandera to import two error-code constants
    # and an ERDDAP /info/ parse.
    "cde-python-common",
    "duckdb>=1.1.0",
    "erddapy>=2.2.4",
    "loguru>=0.7.3",
    "numpy<2.0.0",
    "pandas<2.0.0",
    "pdfkit>=1.0.0",
    "sentry-sdk>=2.38.0",
    "shapely>=2.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["erddap_downloader"]

[tool.uv.sources]
cde-python-common = { path = "../python-common", editable = true }


[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
]
