[project]
name = "cioos-data-explorer-downloader"
version = "0.1.0"
description = "CIOOS Explorer ERDDAP/OBIS downloader."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "duckdb>=2.0.0",
    "erddapy>=3.3.1",
    "loguru>=0.7.3",
    "markdown-it-py>=4.0.0",
    "netcdf4>=1.7.5",
    "numpy>=2.1.0",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "requests>=2.31.0",
    "shapely>=2.1.1",
    "xarray>=2026.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["cioos_downloader"]

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
]
