<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CIOOS Data Explorer</title>
  <link rel="icon" href="/ICON_color_dark_bkg.svg">
  <!-- OFM_TILEJSON in src/components/Map/basemapStyle.js. Fetched while the
       bundle loads: the coastline tiles otherwise wait on this cross-origin
       lookup, which only starts once the map is built. -->

  <script defer data-domain="explore.cioos.ca,all.cioos.ca"
    src="https://plausible.cioos.ca/js/script.hash.outbound-links.local.js"></script>
</head>

<body>
  <div id="map"></div>
  <div id="app">
  </div>
  <script type="module" src="/src/index.jsx"></script>
</body>

</html>
