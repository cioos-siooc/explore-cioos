server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Compress the SPA bundle at the origin. The upstream proxy leaves gzip off
    # for proxied assets (its "until verified" hotfix), so without this the
    # maplibre/turf/bootstrap/react bundle is served uncompressed on every load.
    # nginx won't double-compress, and the proxy forwards this Content-Encoding
    # through unchanged.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # Webpack emits content-hashed filenames (main.<hash>.js, <hash>.js chunks,
    # <hash>.css), so these are immutable — a new deploy produces new names.
    # Cache them hard so a full reload reuses them instead of refetching. Fall
    # through to 404 (not index.html) on a miss so a stale/missing chunk doesn't
    # get served HTML with a JS MIME type.
    location ~* \.(?:js|css|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Images may or may not be hashed; cache moderately rather than forever.
    location ~* \.(?:png|jpg|jpeg|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # index.html must never be cached, so new deploys (with new asset hashes)
    # are picked up immediately.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
