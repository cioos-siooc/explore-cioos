server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The upstream proxy leaves gzip off for proxied assets, so compress here.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # Written by api-proxy.sh only when API_PROXY_HOST is set (PR previews).
    include /etc/nginx/api-proxy*.conf;

    # Content-hashed, so immutable. 404 (not index.html) on a miss so a stale
    # chunk isn't served HTML with a JS MIME type.
    location ~* \.(?:js|css|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Images may or may not be hashed; cache moderately rather than forever.
    location ~* \.(?:png|jpg|jpeg|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # index.html is never cached, so deploys are picked up immediately.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
