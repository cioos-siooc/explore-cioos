[project]
name = "harvester"
version = "0.2.0"
description = "CIOOS Explorer Harvester"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "cioos-metadata-conversion",
    "duckdb>=2.0.0",
    "diskcache>=5.6.3",
    "erddapy>=3.3.1",
    "lxml>=6.1.0",
    "numpy>=2.5.4",
    "pandera>=0.34.1,<0.35.0",
    "pandas>=3.0.6",
    "prefect>=3.8.8",
    "prefect-docker>=0.7.4",
    "psycopg2-binary>=2.9.13",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "sentry-sdk>=2.72.0",
    "shapely>=2.2.0",
    "sqlalchemy>=2.1.5,<3.0.0",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cde_harvester"]

[tool.uv.sources]
cioos-metadata-conversion = { git = "https://github.com/cioos-siooc/cioos-metadata-conversion", rev = "b16d8c93fb0ab0398aa95393632d512130e3083d" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-mock>=3.17.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = "-v --tb=short"
markers = ["network: hits live upstream APIs (set CDE_LIVE_TESTS=1 to run)"]
