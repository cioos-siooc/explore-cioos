user nginx;

events {
  worker_connections 1000;
}

http {
  # Without this include nginx's built-in type map is only html/gif/jpg and
  # default_type falls back to text/plain, which mislabels the download zips.
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Hotfix: avoid partial-send / filesystem + sendfile issues
  sendfile off;
  tcp_nopush off;

  server {
    listen 4000;

    large_client_header_buffers 4 20k;

    # Hotfix: gzip config sane (remove gzip_types *)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
      text/plain
      text/css
      application/json
      application/javascript
      application/xml
      image/svg+xml;

    location /api/ {
      proxy_pass http://web-api:5000/;
    }

    location /harvester_logs/ {
      # LAN only. Public traffic arrives through a proxy whose own address is
      # private, so also refuse anything carrying a forwarding header.
      allow 10.0.0.0/8;
      allow 172.16.0.0/12;
      allow 192.168.0.0/16;
      allow 127.0.0.1;
      deny all;
      if ($http_x_forwarded_for) { return 403; }
      if ($http_cf_connecting_ip) { return 403; }

      alias /usr/share/nginx/html/harvester_logs/;
      autoindex on;
      autoindex_exact_size off;
      autoindex_localtime on;

      # .log is not in mime.types, keep it viewable in-browser
      default_type text/plain;
    }

    location /downloads/ {
      alias /usr/share/nginx/html/downloads/;
      autoindex off;

      # zips are already compressed
      gzip off;

      # always download, never render
      add_header Content-Disposition "attachment";
    }

    location / {
      # Hotfix: avoid gzipping proxied SPA assets until verified
      gzip off;

      proxy_pass http://frontend:80;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }
  }
}
