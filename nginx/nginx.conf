user nginx;

events {
  worker_connections 1000;
}

http {
  access_log /var/log/nginx/access.log;

  # Without this every static file is text/plain, including /downloads/ zips.
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Hotfix: avoid partial-send / filesystem + sendfile issues
  sendfile off;
  tcp_nopush off;

  # How long a BROWSER may hold an API response. apicache ties max-age to the
  # 24h redis TTL, which would pin browsers to pre-harvest data the harvest-time
  # flush cannot revoke; browsers revalidate after a minute instead (cheap: a
  # 304 via apicache's ETag). An empty value omits the header, matching the
  # cacheFor:null routes.
  map $uri $api_browser_cache {
    default          "public, max-age=60";
    ~^/api/download  "";
    ~^/api/nonna     "";
  }

  server {
    listen 4000;

    large_client_header_buffers 4 20k;

    # Hotfix: gzip config sane (remove gzip_types *)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
      text/plain
      text/css
      application/json
      application/javascript
      application/xml
      image/svg+xml
      # MVT tiles: web-api does no compression itself, and gzip halves them.
      application/x-protobuf
      application/vnd.mapbox-vector-tile;

    # Answered by nginx itself so healthcheck.sh can tell "the proxy is down"
    # from "an upstream is down".
    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    location /api/ {
      proxy_pass http://web-api:5000/;

      # Replace apicache's max-age with the browser-facing one; see the
      # $api_browser_cache map above for why the two differ.
      proxy_hide_header Cache-Control;
      add_header Cache-Control $api_browser_cache always;
    }

    location /harvester_logs/ {
      alias /usr/share/nginx/html/harvester_logs/;
      autoindex on;
      autoindex_exact_size off;
      autoindex_localtime on;
    }

    location /downloads/ {
      alias /usr/share/nginx/html/downloads/;
      autoindex off;
      # Force a save-as instead of relying on MIME sniffing to decide the zip
      # isn't inline-viewable.
      add_header Content-Disposition 'attachment';
    }

    location / {
      # Hotfix: avoid gzipping proxied SPA assets until verified
      gzip off;

      proxy_pass http://frontend:80;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }
  }
}
