user nginx;

events {
  worker_connections 1000;
}

http {
  access_log /var/log/nginx/access.log;

  # Without this, nginx has no MIME table and falls back to its compiled-in
  # default_type of text/plain for every static file — including /downloads/
  # zips, which then open inline in the browser instead of downloading.
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Hotfix: avoid partial-send / filesystem + sendfile issues
  sendfile off;
  tcp_nopush off;

  server {
    listen 4000;

    large_client_header_buffers 4 20k;

    # Hotfix: gzip config sane (remove gzip_types *)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
      text/plain
      text/css
      application/json
      application/javascript
      application/xml
      image/svg+xml
      # MVT vector tiles (/api/tiles/**.mvt) — the bulk of the bytes on the
      # default map view. web-api sends them as application/x-protobuf and does
      # no compression itself, so gzipping here typically halves tile transfer.
      application/x-protobuf
      application/vnd.mapbox-vector-tile;

    location /api/ {
      proxy_pass http://web-api:5000/;
    }

    location /harvester_logs/ {
      alias /usr/share/nginx/html/harvester_logs/;
      autoindex on;
      autoindex_exact_size off;
      autoindex_localtime on;
    }

    location /downloads/ {
      alias /usr/share/nginx/html/downloads/;
      autoindex off;
      # Force a save-as instead of relying on MIME sniffing to decide the zip
      # isn't inline-viewable.
      add_header Content-Disposition 'attachment';
    }

    location / {
      # Hotfix: avoid gzipping proxied SPA assets until verified
      gzip off;

      proxy_pass http://frontend:80;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }
  }
}
