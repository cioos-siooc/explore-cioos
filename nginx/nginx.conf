user nginx;

events {
  worker_connections 1000;
}

http {
  access_log /var/log/nginx/access.log;

  # Without this, nginx has no MIME table and falls back to its compiled-in
  # default_type of text/plain for every static file — including /downloads/
  # zips, which then open inline in the browser instead of downloading.
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Hotfix: avoid partial-send / filesystem + sendfile issues
  sendfile off;
  tcp_nopush off;

  # How long a BROWSER may hold an API response, which is a different question
  # from how long redis keeps it. apicache derives its cache-control max-age
  # from the same duration it uses for the redis TTL, and overwrites the header
  # on every cache hit, so the long server-side TTL (24h — see
  # DEFAULT_CACHE_DURATION in web-api/utils/routePipeline.js) would otherwise
  # also pin browsers to pre-harvest data for 24h, which the harvest-time flush
  # has no way to revoke. So redis keeps the answer for the whole harvest
  # interval while the browser revalidates after a minute — cheaply, because
  # apicache stores an ETag and answers If-None-Match with a 304.
  #
  # An empty value makes nginx omit the header entirely, which is what the
  # cacheFor:null routes send today: they register no apicache middleware, so
  # nothing sets cache-control on them now either.
  map $uri $api_browser_cache {
    default          "public, max-age=60";
    ~^/api/download  "";
    ~^/api/nonna     "";
  }

  server {
    listen 4000;

    large_client_header_buffers 4 20k;

    # Hotfix: gzip config sane (remove gzip_types *)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
      text/plain
      text/css
      application/json
      application/javascript
      application/xml
      image/svg+xml
      # MVT vector tiles (/api/tiles/**.mvt) — the bulk of the bytes on the
      # default map view. web-api sends them as application/x-protobuf and does
      # no compression itself, so gzipping here typically halves tile transfer.
      application/x-protobuf
      application/vnd.mapbox-vector-tile;

    # Answered by nginx itself, never proxied: the first step of
    # healthcheck.sh, which separates "the proxy is down" from "an upstream is
    # down". Not logged, because it fires on every healthcheck.
    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    location /api/ {
      proxy_pass http://web-api:5000/;

      # Replace apicache's max-age with the browser-facing one; see the
      # $api_browser_cache map above for why the two differ.
      proxy_hide_header Cache-Control;
      add_header Cache-Control $api_browser_cache always;
    }

    location /harvester_logs/ {
      alias /usr/share/nginx/html/harvester_logs/;
      autoindex on;
      autoindex_exact_size off;
      autoindex_localtime on;
    }

    location /downloads/ {
      alias /usr/share/nginx/html/downloads/;
      autoindex off;
      # Force a save-as instead of relying on MIME sniffing to decide the zip
      # isn't inline-viewable.
      add_header Content-Disposition 'attachment';
    }

    location / {
      # Hotfix: avoid gzipping proxied SPA assets until verified
      gzip off;

      proxy_pass http://frontend:80;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }
  }
}
