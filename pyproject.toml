[project]
name = "explore-cioos"
version = "0.1.0"
description = "CIOOS Explorer"
readme = "README.md"
# Upper bound matches every member project (python-common, harvester, downloader,
# download_scheduler) and .python-version. Unbounded, the root lock
# resolved markers for 3.11-3.13 that no image can satisfy.
requires-python = ">=3.10,<3.11"
# download-scheduler pulls in downloader, and both pull in cde-python-common, so this
# installs every Python project in the tree for the whole-suite pytest run.
dependencies = [
    "download-scheduler",
    "harvester",
]

[tool.uv.sources]
cde-python-common = { path = "python-common", editable = true }
download-scheduler = { path = "download_scheduler", editable = true }
downloader = { path = "downloader", editable = true }
harvester = { path = "harvester", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
# 'integration' tests need a running stack; they self-skip when none is
# reachable. Deselect them entirely with: -m "not integration"
markers = [
    "integration: requires a live database/stack",
]

# Ruff config lives here only. ruff walks up from each file to the nearest
# pyproject.toml that HAS a [tool.ruff] section, so this one governs harvester,
# downloader and download_scheduler too — one place to change, no per-project
# copies to drift. There was no ruff/black/mypy config anywhere despite a
# .ruff_cache on disk, so `ruff check` ran on defaults and nobody's run agreed
# with anyone else's.
[tool.ruff]
# Not 88: 65 lines in the existing source sit between 100 and 120, written
# that way deliberately. 120 is a ceiling for runaway lines, not a reformat
# mandate — no formatter is configured and none is implied.
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# E/W/F   pycodestyle + pyflakes: the real errors.
# I       import sorting (46 files were unsorted).
# UP      pyupgrade: this code targets 3.10, some of it was written for 2.7.
# B       bugbear: mutable defaults, unstrict zip, warn without stacklevel.
# C4      comprehension misuse.
# LOG     logging misuse (root-logger calls).
# DTZ     naive datetimes — this project is all UTC timestamps.
# SIM     the uncontroversial simplifications.
# RUF100  stale `noqa`, i.e. findings silenced with a tool no longer in use.
#
# Deliberately NOT selected: G (logging-f-string). It reports 44 sites, but
# they are loguru calls, where an f-string is the documented style — the rule
# is written for stdlib %-style lazy formatting.
select = ["E", "W", "F", "I", "UP", "B", "C4", "LOG", "DTZ", "SIM", "RUF100"]

[tool.ruff.lint.isort]
# Every project here is installed as an editable path dependency, which ruff
# cannot tell apart from a wheel off PyPI — so without this the tree's own
# packages get sorted in among requests and pandas, and `cde_common` (the
# neutral layer under all of them) reads like a third-party library.
known-first-party = [
    "cde_common",
    "cde_db_loader",
    "cde_harvester",
    "download_scheduler",
    "erddap_downloader",
]

[tool.ruff.lint.per-file-ignores]
# pytest passes fixtures as parameters, so every test that uses a fixture
# "redefines" the fixture function name. 24 findings, all of them this.
"**/tests/**" = ["F811"]
