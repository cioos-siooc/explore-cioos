[project]
name = "explore-cioos"
version = "0.1.0"
description = "CIOOS Explorer"
readme = "README.md"
# Upper bound matches every member project and .python-version; unbounded,
# the root lock resolved markers no image can satisfy.
requires-python = ">=3.14,<3.15"
dependencies = [
    "download-scheduler",
    "harvester",
]

[tool.uv.sources]
download-scheduler = { path = "download_scheduler", editable = true }
harvester = { path = "harvester", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
]

[tool.pytest.ini_options]
# 'integration' tests need a running stack; they self-skip when none is
# reachable. Deselect them entirely with: -m "not integration"
markers = [
    "integration: requires a live database/stack",
]

# Ruff config lives here only: ruff walks up to the nearest pyproject.toml with
# a [tool.ruff] section, so this governs harvester, downloader and
# download_scheduler too.
[tool.ruff]
# A ceiling for runaway lines, not a reformat mandate: no formatter is configured.
line-length = 120
target-version = "py314"

[tool.ruff.lint]
# E/W/F   pycodestyle + pyflakes: the real errors.
# I       import sorting.
# UP      pyupgrade: this code targets 3.14, some of it was written for 2.7.
# B       bugbear: mutable defaults, unstrict zip, warn without stacklevel.
# C4      comprehension misuse.
# LOG     logging misuse (root-logger calls).
# DTZ     naive datetimes — this project is all UTC timestamps.
# SIM     the uncontroversial simplifications.
# RUF100  stale `noqa`, i.e. findings silenced with a tool no longer in use.
#
# Deliberately NOT selected: G (logging-f-string). Its sites are loguru calls,
# where an f-string is the documented style.
select = ["E", "W", "F", "I", "UP", "B", "C4", "LOG", "DTZ", "SIM", "RUF100"]

[tool.ruff.lint.per-file-ignores]
# pytest passes fixtures as parameters, which "redefines" the fixture name.
"**/tests/**" = ["F811"]
