# Sized against the post-harvest warm-up, which replays up to
# CACHE_WARM_MAX_ROUTES (5000) of the most-requested routes — see
# harvester/cde_harvester/redisFunctions.py. Entries are stored compressed by
# the adapter in web-api/utils/cache.js (~6x on tiles, ~29x on the JSON catalog
# routes), so 200mb holds the whole warm set with room for the filtered long
# tail. Host has 14G, and the container has no memory limit of its own.
#
# allkeys-lfu rather than -lru: tile keys are a long tail of z/x/y x filter
# combinations, and frequency is what should decide who survives — the default
# map view is asked for constantly and must never be the thing evicted.
maxmemory 200mb
maxmemory-policy allkeys-lfu
