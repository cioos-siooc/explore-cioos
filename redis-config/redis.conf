# Sized for the post-harvest warm-up (CACHE_WARM_MAX_ROUTES, 5000 routes) with
# entries compressed by web-api/utils/cache.js, plus room for the filtered long
# tail.
#
# allkeys-lfu rather than -lru: tile keys are a long tail of z/x/y x filter
# combinations, and the constantly-requested default map view must never be
# the thing evicted.
maxmemory 200mb
maxmemory-policy allkeys-lfu
